name: Colorado Data Sync

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  sync-colorado-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create sample Colorado data
      run: |
        mkdir -p scraped-data/co
        
        # Create sample bills data
        cat > scraped-data/co/sample-bills.json << 'EOF'
        [
          {
            "id": "co-2025-hb1001",
            "bill_id": "HB24-1001",
            "title": "Concerning the regulation of artificial intelligence systems",
            "session": "2025",
            "chamber": "house",
            "status": "passed_lower",
            "classification": ["bill"],
            "subject": ["Technology", "Government Regulation"],
            "sponsorships": [
              {
                "name": "Rep. Jane Smith",
                "chamber": "house",
                "type": "primary"
              }
            ],
            "actions": [
              {
                "date": "2025-01-15",
                "description": "Introduced in House",
                "classification": ["introduction"],
                "organization": {
                  "name": "Colorado House of Representatives"
                }
              }
            ],
            "votes": [],
            "documents": [],
            "versions": [],
            "sources": [],
            "created_at": "2025-01-15T00:00:00Z",
            "updated_at": "2025-02-01T00:00:00Z"
          },
          {
            "id": "co-2025-sb2001",
            "bill_id": "SB24-2001",
            "title": "Concerning renewable energy incentives",
            "session": "2025",
            "chamber": "senate",
            "status": "passed_upper",
            "classification": ["bill"],
            "subject": ["Energy", "Environment"],
            "sponsorships": [
              {
                "name": "Sen. Maria Garcia",
                "chamber": "senate",
                "type": "primary"
              }
            ],
            "actions": [
              {
                "date": "2025-01-20",
                "description": "Introduced in Senate",
                "classification": ["introduction"],
                "organization": {
                  "name": "Colorado Senate"
                }
              }
            ],
            "votes": [],
            "documents": [],
            "versions": [],
            "sources": [],
            "created_at": "2025-01-20T00:00:00Z",
            "updated_at": "2025-01-20T00:00:00Z"
          }
        ]
        EOF
        
        # Create sample legislators data
        cat > scraped-data/co/sample-legislators.json << 'EOF'
        [
          {
            "id": "co-leg-001",
            "name": "Jane Smith",
            "party": "Democratic",
            "chamber": "house",
            "district": "HD-001",
            "email": "jane.smith@leg.state.co.us",
            "phone": "303-123-4567",
            "office": "Room 200"
          },
          {
            "id": "co-leg-002", 
            "name": "Maria Garcia",
            "party": "Republican",
            "chamber": "senate",
            "district": "SD-002",
            "email": "maria.garcia@leg.state.co.us",
            "phone": "303-234-5678",
            "office": "Room 300"
          }
        ]
        EOF
        
        echo "Created sample Colorado data files"
        
    - name: Upload Data
      uses: actions/upload-artifact@v4
      with:
        name: colorado-sample-data
        path: scraped-data/
        retention-days: 30
        
    - name: Trigger Supabase Sync
      run: |
        # Send sample data to your Vercel API
        curl -X POST "${{ secrets.VERCEL_SYNC_URL }}" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Type: application/json" \
          -d '{
            "source": "github-actions",
            "data_type": "scraped",
            "bills_data": [
              {
                "id": "co-2025-hb1001",
                "bill_id": "HB24-1001",
                "title": "Concerning the regulation of artificial intelligence systems",
                "session": "2025",
                "chamber": "house",
                "status": "passed_lower",
                "classification": ["bill"],
                "subject": ["Technology"],
                "sponsorships": [{"name": "Rep. Jane Smith", "chamber": "house", "type": "primary"}],
                "actions": [{"date": "2025-01-15", "description": "Introduced in House", "classification": ["introduction"], "organization": {"name": "Colorado House"}}],
                "votes": [],
                "documents": [],
                "versions": [],
                "sources": [],
                "created_at": "2025-01-15T00:00:00Z",
                "updated_at": "2025-02-01T00:00:00Z"
              }
            ]
          }'
      env:
        VERCEL_SYNC_URL: ${{ secrets.VERCEL_SYNC_URL }}
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
        
    - name: Commit Data (Optional)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add scraped-data/
        if ! git diff --staged --quiet; then
          git commit -m "Update Colorado sample data [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/KDL-tw/little-birdv2.git HEAD:main || echo "Push failed - continuing anyway"
        else
          echo "No changes to commit"
        fi
      if: github.ref == 'refs/heads/main'
      continue-on-error: true
